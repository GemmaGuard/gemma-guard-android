apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.gemmaguard.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gemmaguard.app'
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        buildConfigField 'String', 'GEMMA_MODEL_FILE_NAME', '"gemma-4-E2B-it.litertlm"'
        buildConfigField 'String', 'GEMMA_DEBUG_MODEL_PATH', '"/data/local/tmp/llm/gemma-4-E2B-it.litertlm"'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:latest.release'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
}
